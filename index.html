<!DOCTYPE html>
<html>
<head>
    <title>EduGenie</title>
</head>
<body>
    <h1>EduGenie - AI Learning Assistant</h1>
    <textarea id="question" rows="4" cols="50" placeholder="Ask your question..."></textarea><br>
    <button onclick="askAI()">Get Answer</button>
    <p id="answer"></p>

    <script>
        async function askAI() {
            const question = document.getElementById("question").value;
            const response = await fetch("/ask", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({question: question})
            });
            const data = await response.json();
            document.getElementById("answer").innerText = data.answer || JSON.stringify(data);
        }
    </script>
</body>
</html>
